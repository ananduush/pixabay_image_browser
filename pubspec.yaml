name: pixabay_image_browser
description: "Aperture: a Pixabay image browser built for the Flutter developer assignment."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # State, dependency injection and routing.
  get: ^4.7.3
  # Pixabay REST client.
  dio: ^5.11.0
  # Image loading with a shared disk cache; the download reuses that cache.
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.2
  # Save to the device Photos / media library.
  gal: ^2.3.3
  # Supabase email/password authentication and session persistence.
  supabase_flutter: ^2.17.2
  # Local per-user Favourites (async API reports write failures).
  shared_preferences: ^2.5.5
  # Instrument Sans + Newsreader, bundled under assets/google_fonts.
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3
  # MemoryFileSystem for the download service tests.
  file: ^7.0.1

flutter:
  uses-material-design: true
  # Static instances of the two families google_fonts resolves by file name
  # (<Family>-<Weight>.ttf); runtime fetching is disabled in main.dart.
  assets:
    - assets/google_fonts/
